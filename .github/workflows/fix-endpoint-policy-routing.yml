name: Repair endpoint policy lazy-router traversal

on:
  push:
    branches:
      - automation/fix-endpoint-policy-routing

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-24.04
    env:
      APP_ENV: test
      DATABASE_URL: postgresql+psycopg://breero:breero@localhost:5432/breero
      REDIS_URL: redis://localhost:6379/0
    steps:
      - name: Check out endpoint-registry branch
        uses: actions/checkout@v4
        with:
          ref: refactor/api-router-registry
          fetch-depth: 0
      - name: Check out maintenance script
        uses: actions/checkout@v4
        with:
          ref: automation/fix-endpoint-policy-routing
          path: .maintenance
          sparse-checkout: scripts/maintenance/fix_endpoint_policy_routing.py
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Patch registry for FastAPI lazy included routers
        run: python .maintenance/scripts/maintenance/fix_endpoint_policy_routing.py
      - name: Verify focused registry repair
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install -e 'apps/api[dev]'
          python -m ruff check --fix \
            apps/api/app/api/policy_registry.py \
            apps/api/tests/test_endpoint_policy_registry.py
          python -m ruff format \
            apps/api/app/api/policy_registry.py \
            apps/api/tests/test_endpoint_policy_registry.py
          cd apps/api
          python -m ruff check app tests scripts
          python -m mypy app
          python -m pytest -q tests/test_endpoint_policy_registry.py
          python scripts/generate_openapi.py
      - name: Commit and push focused repair
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            apps/api/app/api/policy_registry.py \
            apps/api/tests/test_endpoint_policy_registry.py
          git commit -m "fix(api): traverse lazy included routers in endpoint registry"
          git push origin HEAD:refactor/api-router-registry
