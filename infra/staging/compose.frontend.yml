name: breero-staging-frontend

x-frontend: &frontend
  image: ${BREERO_STAGING_WEB_IMAGE:?Set immutable BREERO_STAGING_WEB_IMAGE digest}
  restart: unless-stopped
  init: true
  read_only: true
  tmpfs: [/tmp:rw,noexec,nosuid,size=32m]
  security_opt: [no-new-privileges:true]
  cap_drop: [ALL]
  networks: [frontend_edge]

services:
  web:
    <<: *frontend
    container_name: breero-staging-web
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1:3000/"]
      interval: 10s
      timeout: 4s
      retries: 10
      start_period: 20s

networks:
  frontend_edge:
    external: true
    name: breero_staging_frontend_edge
