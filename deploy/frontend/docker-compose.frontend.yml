name: breero-frontend

services:
  web:
    image: ${BREERO_FRONTEND_IMAGE:?Set BREERO_FRONTEND_IMAGE to an immutable tag or digest}
    container_name: breero-web
    env_file:
      - path: ${BREERO_FRONTEND_ENV_FILE:-.env.frontend}
        required: true
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_MODE: live
      HOSTNAME: 0.0.0.0
      PORT: "3000"
    expose:
      - "3000"
    restart: unless-stopped
    init: true
    user: "1001:1001"
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=32m
      - /app/apps/web/.next/cache:rw,noexec,nosuid,size=64m,uid=1001,gid=1001
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 256
    mem_limit: 1g
    cpus: 1.0
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 3s
      retries: 5
      start_period: 20s
    stop_grace_period: 30s
    networks:
      - frontend

networks:
  frontend:
    external: true
    name: ${BREERO_FRONTEND_NETWORK:-breero_frontend}
